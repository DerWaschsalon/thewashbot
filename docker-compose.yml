services:
  discord-bot:
    image: ghcr.io/navonex/thewashbot:latest
    container_name: thewashbot
    restart: unless-stopped
    env_file: .env
    ports:
      - "8787:8787"   # DeckBar-Gruppen-DPS-Webhook, siehe /setup dps-webhook
      - "8789:8789"   # Web-Dashboard
    volumes:
      - ./data:/data
